# Example kouja-agent configuration.
# Install with: install -D -m 0600 deploy/config.example.yaml /etc/kouja/config.yaml
# The shipped systemd unit reads /etc/kouja/config.yaml by default.

host_id_file: /var/lib/kouja/host-id
data_dir: /var/lib/kouja
secret_key_file: /var/lib/kouja/secret.key
emergency_log: /var/lib/kouja/emergency.log

listen:
  address: 0.0.0.0:9443
  tls:
    cert_file: /etc/kouja/tls/server.crt
    key_file: /etc/kouja/tls/server.key
    client_ca_file: /etc/kouja/tls/client-ca.crt
    min_version: TLS1.3

# Optional local admin UI. It is disabled by default, binds only to loopback,
# and has no authentication. Any local process that can reach it is
# root-equivalent. Enable only on a single-administrator host and never proxy
# or port-forward it.
admin_ui:
  enabled: false
  address: 127.0.0.1:9444

certificate_authority:
  enabled: false
  key_file: /etc/kouja/tls/ca.key
  certificate_dir: /etc/kouja/tls/clients
  revocation_log_file: /var/lib/kouja/revoked-serials.log
  default_ttl_days: 30
  max_ttl_days: 365
  max_active_certificates: 1000

storage:
  headroom_percent: 5
  headroom_min_bytes: 1073741824
  wipe_timeout_seconds: 1800
  # VGs to seed on the first start. After first start, use the mTLS admin API
  # or the local admin UI to register or deregister VGs.
  vgs: []
  # Storage-class mappings, e.g. {fast: vg-nvme, hdd: vg-hdd}.
  classes: {}

targets:
  iscsi:
    enabled: true
    iqn_prefix: iqn.2026-11.io.kouja
    portals:
      - address: 0.0.0.0
        port: 3260
  nvme_tcp:
    enabled: false
    nqn_prefix: nqn.2026-11.io.kouja
    portals:
      - address: 0.0.0.0
        port: 4420
    tls:
      enabled: true
      keyring: .nvme
      tlshd_service: tlshd

operations:
  max_attempts: 3
  total_timeout_seconds: 300
  step_timeout_seconds:
    create: 120
    export: 60
    delete: 120
    resize: 120

admission:
  max_concurrent_operations: 64
  per_caller_operations: 10
  capacity_requests_per_second: 10

state:
  backup_dir: /var/lib/kouja/backups
  # Set to an off-host writable mount for backups, or leave empty to disable.
  backup_target: ""
  backup_interval_seconds: 900
  backup_retention_short: 96
  backup_retention_daily: 7
  backup_retention_weekly: 4
  integrity_check_interval_seconds: 86400
  reconcile_interval_seconds: 60
  audit_retention_days: 90
  s3_backup:
    enabled: false
    bucket: ''
    prefix: kouja/
    region: ''
    endpoint: ''
    force_path_style: false
    server_side_encryption: AES256
    kms_key_id: ''
    per_backup_folder: true   # group each backup under YYYYMMMDDHHmm/
    retention_days: 7
    encryption_key_file: ''
