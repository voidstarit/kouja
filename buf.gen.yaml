version: v1
plugins:
  - name: go
    out: gen
    opt:
      - paths=source_relative
  - name: go-grpc
    out: gen
    opt:
      - paths=source_relative
  - name: grpc-gateway
    out: gen
    opt:
      - paths=source_relative
  - name: kouja-client
    out: gen
  - name: openapiv2
    out: gen/openapi
    opt:
      - allow_merge=true
      - merge_file_name=openapi
      - json_names_for_fields=true
      - proto3_optional_nullable=true
      - preserve_rpc_order=true
      - openapi_naming_strategy=simple
      - simple_operation_ids=true
      - openapi_configuration=proto/openapi.yaml
